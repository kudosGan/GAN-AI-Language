# Builds the website in the Website folder and publishes it with GitHub Pages
# every time something is pushed to the main branch.
name: Publish website

on:
  push:
    branches: [main]
    paths: ["Website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:        # lets you also start it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
        working-directory: Website
      - run: npm run build
        working-directory: Website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
